<svg width="800" height="500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad-travel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#06B6D4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0083a1;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-opacity="0.15"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="500" fill="url(#grad-travel)"/>
  
  <!-- Decorative circles -->
  <circle cx="100" cy="80" r="120" fill="white" opacity="0.08"/>
  <circle cx="700" cy="420" r="150" fill="white" opacity="0.08"/>
  
  <!-- Card mockup -->
  <g transform="translate(225, 145)">
    <rect x="0" y="0" width="350" height="210" rx="12" fill="white" filter="url(#shadow)"/>
    
    <!-- Card content -->
    <text x="25" y="45" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#06B6D4">
      Travel & Tourism
    </text>
    <text x="25" y="70" font-family="Arial, sans-serif" font-size="14" fill="#666">
      Premium Business Card
    </text>
    
    <!-- Icon -->
    <text x="175" y="140" font-size="48" text-anchor="middle">
      ✈️
    </text>
    
    <!-- Bottom details -->
    <text x="25" y="185" font-family="Arial, sans-serif" font-size="11" fill="#999">
      QuickCard • Creative
    </text>
  </g>
  
  <!-- Category badge -->
  <rect x="30" y="30" width="140" height="32" rx="16" fill="white" opacity="0.95"/>
  <text x="100" y="51" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#06B6D4" text-anchor="middle">
    CREATIVE
  </text>
</svg>